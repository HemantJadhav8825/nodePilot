name: NodePilot Dynamic Multi-App Pipeline

env:
  NODE_ENV: production

steps:
  - name: "Validate: Environment"
    run: |
      set -e
      : "${TARGET_DIR:?TARGET_DIR is required}"
      : "${BRANCH:?BRANCH is required}"
      : "${PM2_NAME:?PM2_NAME is required}"

  - name: "Git: Sync Repository"
    run: |
      set -e
      echo "Deploying $PM2_NAME to $TARGET_DIR ($BRANCH)"
      cd "$TARGET_DIR"
      git fetch origin "$BRANCH"
      git checkout "$BRANCH"
      git reset --hard "origin/$BRANCH"

  - name: "Install: Dependencies"
    run: |
      set -e
      cd "$TARGET_DIR"

      case "$PM2_NAME" in
        panchnity|panchnity-next)
          # echo "Cleaning node_modules and .next for $PM2_NAME..."
          # rm -rf node_modules
          # rm -rf .next

          echo "Installing ALL dependencies (including devDependencies)..."
          npm install --include=dev
          ;;
        *)
          echo "Installing production dependencies only..."
          npm install
          ;;
      esac

  - name: "Build: Application (Conditional)"
    run: |
      set -e
      cd "$TARGET_DIR"

      case "$PM2_NAME" in
        admin-panel)
          echo "Building admin-panel..."
          npm run build
          ;;
        panchnity)
          echo "Building panchnity (prod)..."
          npm run build:prod
          ;;
        panchnity-next)
          echo "Building panchnity-next..."
          npm run build
          ;;
        panchnity-api)
          echo "API project detected — skipping build."
          ;;
        *)
          echo "Unknown PM2_NAME ($PM2_NAME) — skipping build."
          ;;
      esac

  - name: "Process: Start or Reload PM2"
    run: |
      set -e
      cd "$TARGET_DIR"

      if pm2 list | grep -q "$PM2_NAME"; then
        echo "Reloading PM2 process..."
        pm2 reload "$PM2_NAME" --update-env
      else
        echo "Starting new PM2 process..."

        if npm run | grep -q " start"; then
          pm2 start npm --name "$PM2_NAME" -- start
        else
          pm2 start ecosystem.config.js --only "$PM2_NAME"
        fi
      fi

  - name: "Post-Deploy: Save & Reload Nginx"
    run: |
      pm2 save
      sudo nginx -t && sudo nginx -s reload
